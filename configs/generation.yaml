# Fixed decoding protocol (plan §5). Changing anything here means regenerating all traces.

prompt_version: v1
decoding:
  do_sample: false        # greedy
  max_new_tokens: 512
batch_size: 16            # lower to 8 if a T4 runs out of memory
seed: 2026

prompts:
  gsm8k: prompts/gsm8k_v1.txt
  csqa: prompts/csqa_v1.txt

# Dry-run gate: every model must reach this format-ok rate before the full run.
min_format_ok_rate: 0.90
