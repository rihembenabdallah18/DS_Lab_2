# Datasets and sampling design (plan §3 and §6).

seed: 2026

datasets:
  gsm8k:
    task: math
    hf_id: openai/gsm8k
    hf_config: main
    split: test           # 1,319 items
  csqa:
    task: commonsense
    hf_id: tau/commonsense_qa
    hf_config: null
    split: validation     # 1,221 items; test labels are not public

# Screening pool: questions per dataset, answered by every generator, scored automatically.
pool_size: 300
dry_run_size: 10

# Annotation set: shared questions per dataset, by k = number of models that answered wrong.
allocation:
  0: 16
  1: 16
  2: 16
  3: 12

# Pilot partition (per dataset, by k); the rest of the selection is the main partition.
pilot_allocation:
  0: 3
  1: 3
  2: 2
  3: 2
