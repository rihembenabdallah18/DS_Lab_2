# Automated evaluators for RQ3 (plan §8–9). Filled in and frozen before the RQ3 runs.

judge:
  # Must not be a Qwen, Llama or Phi model (generator families).
  provider: TBD           # gemini | groq
  model: TBD              # record the exact model ID used
  temperature: 0
  reference_based: true   # the judge sees the gold answer
  prompt: prompts/judge_v1.txt   # written after the taxonomy freeze
  # API keys come from environment variables or Kaggle Secrets, never from this file:
  # GEMINI_API_KEY / GROQ_API_KEY

prm:
  hf_id: Qwen/Qwen2.5-Math-PRM-7B
  fallback_hf_id: Skywork/Skywork-o1-Open-PRM-Qwen-2.5-1.5B
  dtype: float16
  device_map: auto        # split across Kaggle's 2x T4
  # First step scoring below this is the predicted first error. Fixed in advance,
  # or tuned on ProcessBench GSM8K, never on our own traces.
  threshold: 0.5

calibration:
  hf_id: Qwen/ProcessBench
  split: gsm8k
