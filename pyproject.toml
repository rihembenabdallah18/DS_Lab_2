[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slm-traces"
version = "0.1.0"
description = "Reasoning-failure taxonomy for small language models on GSM8K and CommonsenseQA"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# GPU work on Kaggle (torch is preinstalled there).
gen = ["datasets>=2.18", "transformers>=4.49", "accelerate>=0.30"]
# Analysis and RQ3.
analysis = ["numpy", "scipy", "scikit-learn", "matplotlib"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
